apiVersion: v1
kind: Service
metadata:
  name: mongo-workout
  namespace: {{ .Values.namespace }}
  labels:
    app: mongo-workout
    {{- include "fitrack.labels" . | nindent 4 }}
spec:
  selector:
    app: mongo-workout
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-workout
  namespace: {{ .Values.namespace }}
  labels:
    app: mongo-workout
    {{- include "fitrack.labels" . | nindent 4 }}
spec:
  serviceName: mongo-workout
  replicas: 1
  selector:
    matchLabels:
      app: mongo-workout
  template:
    metadata:
      labels:
        app: mongo-workout
        {{- include "fitrack.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mongo
          image: {{ .Values.images.mongo.repository }}:{{ .Values.images.mongo.tag }}
          imagePullPolicy: {{ .Values.images.mongo.pullPolicy }}
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mongodb.storage }}
