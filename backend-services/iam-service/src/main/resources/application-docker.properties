spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongo-iam:27017/fitrack_iam}

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:fitrack}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:fitrack}

spring.config.import=optional:classpath:application-metrics.properties
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=1MB
