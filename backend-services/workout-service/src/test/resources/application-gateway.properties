fitrack.gateway.require-trusted-header=true
fitrack.gateway.user-id-header=X-Internal-User-Id
fitrack.gateway.trusted-secret=fitrack-dev-gateway
fitrack.encryption.workout-key=test-workout-encryption-key-32-chars-min

fitrack.messaging.exchange=fitrack.events
fitrack.messaging.routing-keys.user-registered=user.registered
fitrack.messaging.routing-keys.user-deleted=user.deleted
fitrack.messaging.queues.user-registered=workout-service.user-registered
fitrack.messaging.queues.user-deleted=workout-service.user-deleted

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
