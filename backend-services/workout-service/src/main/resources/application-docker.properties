# Each container has its own network namespace — use 8080 in Docker (8081 is for native dev beside IAM).
server.port=8080

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongo-workout:27017/fitrack_workout}

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:fitrack}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:fitrack}

fitrack.gateway.require-trusted-header=true
fitrack.gateway.user-id-header=X-Internal-User-Id
fitrack.gateway.trusted-secret=${GATEWAY_TRUSTED_SECRET:fitrack-dev-gateway}

fitrack.encryption.workout-key=${WORKOUT_ENCRYPTION_KEY:fitrack-dev-workout-encryption-key-32b}

# No Spring CORS in Docker — Traefik cors@file handles browser CORS at the gateway
spring.web.cors.enabled=false

spring.config.import=optional:classpath:application-metrics.properties
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=1MB
