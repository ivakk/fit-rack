spring.profiles.active=dev

spring.data.mongodb.auto-index-creation=true

server.port=8081

fitrack.gateway.user-id-header=X-Internal-User-Id
fitrack.gateway.trusted-header=X-Gateway-Trusted
fitrack.gateway.trusted-secret=${GATEWAY_TRUSTED_SECRET:fitrack-dev-gateway}
fitrack.gateway.require-trusted-header=false
fitrack.gateway.forbidden-client-header=X-User-Id

cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost,http://127.0.0.1
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type
cors.allow-credentials=true

management.endpoints.web.exposure.include=health,info

logging.level.org.springframework.web=INFO

# RabbitMQ (consume IAM domain events)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=fitrack
spring.rabbitmq.password=fitrack
fitrack.messaging.exchange=fitrack.events
fitrack.messaging.routing-keys.user-registered=user.registered
fitrack.messaging.queues.user-registered=workout-service.user-registered

# Workout field encryption at rest (AES-256-GCM). Override in production via env.
fitrack.encryption.workout-key=${WORKOUT_ENCRYPTION_KEY:fitrack-dev-workout-encryption-key-32b}
