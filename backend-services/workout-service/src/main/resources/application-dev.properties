spring.data.mongodb.uri=mongodb://localhost:27017/fitrack_workout

# Local Gradle without Traefik: allow X-User-Id for manual testing only
fitrack.gateway.require-trusted-header=false
fitrack.gateway.user-id-header=X-User-Id

# Spring MVC CORS (native Gradle only — Docker uses Traefik at the gateway)
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost,http://127.0.0.1
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type
cors.allow-credentials=true
