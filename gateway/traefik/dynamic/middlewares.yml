http:
  middlewares:
    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
        accessControlAllowOriginListRegex:
          - "^https?://(localhost|127\\.0\\.0\\.1)(:\\d+)?$"
        accessControlAllowCredentials: true
        accessControlMaxAge: 100
        addVaryHeader: true

    strip-client-identity:
      headers:
        customRequestHeaders:
          X-User-Id: ""
          X-Internal-User-Id: ""
          X-Internal-User-Email: ""
          X-Internal-User-Role: ""
          X-Gateway-Trusted: ""

    iam-forwardauth:
      forwardAuth:
        address: "http://iam:8080/auth/forward-auth"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Internal-User-Id
          - X-Internal-User-Email
          - X-Internal-User-Role
        authRequestHeaders:
          - Authorization

    gateway-trusted:
      headers:
        customRequestHeaders:
          X-Gateway-Trusted: "fitrack-dev-gateway"
