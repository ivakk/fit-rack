# Static routes — do not rely on the Docker provider (socket discovery is flaky on some hosts).
http:
  routers:
    iam-auth-sensitive:
      entryPoints:
        - web
      rule: Path(`/auth/login`) || Path(`/auth/register`) || Path(`/auth/refresh`)
      middlewares:
        - cors@file
        - security-headers@file
        - rate-limit-auth@file
      service: iam
      priority: 20

    iam:
      entryPoints:
        - web
      rule: PathPrefix(`/auth`) && !Method(`OPTIONS`)
      middlewares:
        - cors@file
        - security-headers@file
      service: iam
      priority: 10

    iam-options:
      entryPoints:
        - web
      rule: PathPrefix(`/auth`) && Method(`OPTIONS`)
      middlewares:
        - cors@file
      service: iam
      priority: 100

    workout:
      entryPoints:
        - web
      rule: PathPrefix(`/workouts`) && !Method(`OPTIONS`)
      middlewares:
        - cors@file
        - security-headers@file
        - strip-client-identity@file
        - iam-forwardauth@file
        - gateway-trusted@file
      service: workout
      priority: 10

    workout-options:
      entryPoints:
        - web
      rule: PathPrefix(`/workouts`) && Method(`OPTIONS`)
      middlewares:
        - cors@file
      service: workout
      priority: 100

    health:
      entryPoints:
        - web
      rule: Path(`/health`)
      middlewares:
        - security-headers@file
        - health-to-actuator@file
      service: iam
      priority: 30

  services:
    iam:
      loadBalancer:
        servers:
          - url: http://iam:8080

    workout:
      loadBalancer:
        servers:
          - url: http://workout:8080
