# FiTrack — SonarCloud monorepo (https://sonarcloud.io)
# CI secrets: SONAR_TOKEN, SONAR_HOST_URL=https://sonarcloud.io
# CI variable: SONAR_ORGANIZATION

sonar.projectKey=fitrack
sonar.projectName=FiTrack
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# One SonarCloud project, three modules — paths are relative to each module base dir
sonar.modules=iam,workout,frontend

# --- IAM service ---
iam.sonar.projectName=IAM Service
iam.sonar.projectBaseDir=backend-services/iam-service
iam.sonar.sources=src/main/java
iam.sonar.tests=src/test/java
iam.sonar.java.source=21
iam.sonar.java.binaries=build/classes/java/main
iam.sonar.java.test.binaries=build/classes/java/test
iam.sonar.junit.reportPaths=build/test-results/test
iam.sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
iam.sonar.exclusions=**/*Application.java
iam.sonar.cpd.exclusions=**/*Test.java

# --- Workout service ---
workout.sonar.projectName=Workout Service
workout.sonar.projectBaseDir=backend-services/workout-service
workout.sonar.sources=src/main/java
workout.sonar.tests=src/test/java
workout.sonar.java.source=21
workout.sonar.java.binaries=build/classes/java/main
workout.sonar.java.test.binaries=build/classes/java/test
workout.sonar.junit.reportPaths=build/test-results/test
workout.sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
workout.sonar.exclusions=**/*Application.java
workout.sonar.cpd.exclusions=**/*Test.java

# --- Frontend (co-located Vitest files) ---
frontend.sonar.projectName=Main Frontend
frontend.sonar.projectBaseDir=frontends/main-frontend
frontend.sonar.sources=src
frontend.sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
frontend.sonar.exclusions=**/node_modules/**,**/.next/**
frontend.sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info
