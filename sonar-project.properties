# FiTrack — SonarCloud (https://sonarcloud.io)
# Project key + organization are set in build.gradle (org.sonarqube plugin).
# CI secret: SONAR_TOKEN
#
# IMPORTANT: SonarCloud UI → Administration → Analysis Method →
# disable "Automatic Analysis" (it does not support coverage).

sonar.projectName=FiTrack
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Sources (repo-root paths)
sonar.sources=backend-services/iam-service/src/main/java,backend-services/workout-service/src/main/java,frontends/main-frontend/src
sonar.tests=backend-services/iam-service/src/test/java,backend-services/workout-service/src/test/java
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Java
sonar.java.source=21
sonar.java.coveragePlugin=jacoco
sonar.java.binaries=backend-services/iam-service/build/classes/java/main,backend-services/workout-service/build/classes/java/main
sonar.java.test.binaries=backend-services/iam-service/build/classes/java/test,backend-services/workout-service/build/classes/java/test
sonar.junit.reportPaths=backend-services/iam-service/build/test-results/test,backend-services/workout-service/build/test-results/test

# Coverage — paths relative to repo root (also passed via -D in CI workflow)
sonar.coverage.jacoco.xmlReportPaths=backend-services/iam-service/build/reports/jacoco/test/jacocoTestReport.xml,backend-services/workout-service/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=frontends/main-frontend/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/.next/**,**/build/**,**/dist/**,**/*Application.java
sonar.cpd.exclusions=**/*Test.java,**/*.test.ts,**/*.test.tsx
