# FiTrack — SonarQube / SonarCloud (https://sonarcloud.io or self-hosted)
# Set SONAR_TOKEN in GitHub secrets and SONAR_ORGANIZATION + SONAR_PROJECT_KEY in CI.

sonar.projectKey=fitrack
sonar.projectName=FiTrack
sonar.projectVersion=0.1.0

sonar.sourceEncoding=UTF-8

# Java backends
sonar.java.source=21
sonar.sources=\
  backend-services/iam-service/src/main,\
  backend-services/workout-service/src/main,\
  frontends/main-frontend/src

sonar.tests=\
  backend-services/iam-service/src/test,\
  backend-services/workout-service/src/test

# Frontend tests are co-located (*.test.ts/tsx) — use inclusions, not a duplicate src root
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.java.binaries=\
  backend-services/iam-service/build/classes/java/main,\
  backend-services/workout-service/build/classes/java/main

sonar.java.test.binaries=\
  backend-services/iam-service/build/classes/java/test,\
  backend-services/workout-service/build/classes/java/test

sonar.junit.reportPaths=\
  backend-services/iam-service/build/test-results/test,\
  backend-services/workout-service/build/test-results/test

sonar.coverage.jacoco.xmlReportPaths=\
  backend-services/iam-service/build/reports/jacoco/test/jacocoTestReport.xml,\
  backend-services/workout-service/build/reports/jacoco/test/jacocoTestReport.xml

sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/build/**,\
  **/dist/**,\
  **/*Application.java

sonar.cpd.exclusions=**/*Test.java,**/*.test.ts,**/*.test.tsx

# TypeScript (frontend) — analyzed without coverage until configured
sonar.typescript.lcov.reportPaths=frontends/main-frontend/coverage/lcov.info
