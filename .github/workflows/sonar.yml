# SonarCloud on every push (GitHub-hosted CI)
name: SonarQube

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    if: vars.SONAR_ENABLED != 'false'
    steps:
      - name: Verify SonarCloud is configured
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error::SonarCloud is not configured for CI."
            echo "GitHub Actions cannot reach SonarQube on your Mac (localhost)."
            echo "For analysis on every push, use SonarCloud — see docs/SONAR.md:"
            echo "  1. Import repo at https://sonarcloud.io"
            echo "  2. Secrets: SONAR_TOKEN, SONAR_HOST_URL=https://sonarcloud.io"
            echo "  3. Variable: SONAR_ORGANIZATION=<your-org-key>"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Backend tests with JaCoCo coverage
        run: |
          (cd backend-services/iam-service && ./gradlew test jacocoTestReport --no-daemon)
          (cd backend-services/workout-service && ./gradlew test jacocoTestReport --no-daemon)

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontends/main-frontend/package-lock.json

      - name: Install frontend (TypeScript analysis)
        working-directory: frontends/main-frontend
        run: npm ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'fitrack' }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true
