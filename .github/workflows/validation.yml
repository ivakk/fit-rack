# Slower validation — stack E2E + optional k6 smoke (Fontys SQA: deploy-like env, acceptance, performance)
name: Validation

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  gateway-e2e:
    name: Docker stack + gateway acceptance test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          ./scripts/render-traefik.sh

      - name: Start stack
        run: docker compose up --build -d mongo-iam mongo-workout rabbitmq iam workout traefik

      - name: Wait for healthy services
        run: |
          chmod +x scripts/wait-for-stack.sh
          ./scripts/wait-for-stack.sh 300

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cucumber acceptance (docs/acceptance-scenarios.feature)
        env:
          GATEWAY_URL: http://localhost
        run: chmod +x scripts/test-acceptance.sh && ./scripts/test-acceptance.sh

      - name: Tear down
        if: always()
        run: docker compose down -v

  k6-smoke:
    name: k6 performance smoke (optional evidence)
    runs-on: ubuntu-latest
    needs: gateway-e2e
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          ./scripts/render-traefik.sh

      - name: Start stack for load test
        run: docker compose --profile loadtest up --build -d mongo-iam mongo-workout rabbitmq iam workout traefik

      - name: Wait for stack
        run: |
          chmod +x scripts/wait-for-stack.sh
          ./scripts/wait-for-stack.sh 300

      - name: k6 smoke via Traefik
        run: |
          docker compose --profile loadtest run --rm \
            -e K6_GATEWAY_URL=http://traefik:80 \
            -e K6_VUS=3 \
            -e K6_DURATION=30s \
            -e K6_SETUP_USERS=1 \
            -e K6_SETUP_DELAY=0 \
            k6 run /scripts/k6/smoke.js

      - name: Tear down
        if: always()
        run: docker compose --profile loadtest down -v

  k6-nfr-01:
    name: k6 NFR-01 + NFR-05 load test (manual)
    runs-on: ubuntu-latest
    needs: gateway-e2e
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          ./scripts/render-traefik.sh

      - name: Start stack for load test
        run: docker compose --profile loadtest up --build -d mongo-iam mongo-workout rabbitmq iam workout traefik

      - name: Wait for stack
        run: |
          chmod +x scripts/wait-for-stack.sh
          ./scripts/wait-for-stack.sh 300

      - name: k6 NFR-01 load test via Traefik
        run: chmod +x scripts/load-test.sh && ./scripts/load-test.sh nfr-01-load

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-nfr-01-summary
          path: load-testing/results/summary-*.json
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose --profile loadtest down -v
