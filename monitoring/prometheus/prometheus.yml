global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: iam
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["iam:8080"]
        labels:
          service: iam

  - job_name: workout
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["workout:8080"]
        labels:
          service: workout

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq
